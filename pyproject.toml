[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmf-transcriber"
version = "1.0.0"
description = "Polyphonic piano transcription with standard and group-sparse NMF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",     # evaluate
    "matplotlib>=3.7",   # report
    "music21>=9.1",      # sheet
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
nmf-transcriber = "nmf_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pretty_midi imports pkg_resources on some setuptools versions
    "ignore::DeprecationWarning:pretty_midi",
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
