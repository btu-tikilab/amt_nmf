[project]
name = "nmf-transcriber"
version = "1.0.0"
description = "NMF Polyphonic Piano Transcription — Standard and Group-Sparse"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.13",
    "pretty_midi>=0.2.10",
    "typer>=0.12",
    "mir_eval>=0.7",
    "music21>=9.1",
    "matplotlib>=3.9",
]

[project.scripts]
nmf-transcriber = "nmf_cli.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmf_core", "src/nmf_cli"]
